<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="number" id="diem" placeholder="Nhập điểm">
    <button onclick="xepLoai()">Xếp loại</button>
</body>
<script>
    function xepLoai() {
        let diem = document.getElementById("diem").value;

        if (diem >= 8) {
            alert("Giỏi");
        } else if (diem >= 6.5) {
            alert("Khá");
        } else if (diem >= 5) {
            alert("Trung bình");
        } else {
            alert("Yếu");
        }
    }
</script>

</html>
