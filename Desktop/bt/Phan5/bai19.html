<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" id="tuoi" placeholder="Nhập tuổi">
    <button onclick="kiemTra()">Kiểm tra</button>
</body>
    <script>
        function kiemTra() {
            let tuoi = document.getElementById("tuoi").value;

            if (tuoi >= 18) {
                alert("Đủ tuổi lái xe");
            } else {
                alert("Chưa đủ tuổi lái xe");
            }
        }
    </script>
</html>
