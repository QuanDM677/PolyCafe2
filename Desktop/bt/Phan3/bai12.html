<script>
    let tuoi = Number(prompt("Nhập tuổi:"));

    if (tuoi <= 12) {
        console.log("Trẻ em");
    } else if (tuoi <= 17) {
        console.log("Thiếu niên");
    } else if (tuoi <= 59) {
        console.log("Người lớn");
    } else {
        console.log("Người cao tuổi");
    }
</script>
